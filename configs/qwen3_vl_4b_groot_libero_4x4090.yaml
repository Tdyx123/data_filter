paths:
  model: /data/dwb/models/Qwen3-VL-4B-Instruct
  lerobot: /data/dwb/datasets/LIBERO_lerobot
  output: null

data:
  dataset_type: libero
  prior_dataset: libero90
  target_dataset: libero10_5
  target_all_tasks: true
  target_only: false
  sample_weights: [1.0, 1.0]
  prior_selection:
    scores: /data/dwb/libero90_sqcn/filter/top10pct/scores.csv
    top_percent: null
    prefiltered: false
    relcore_manifest: null
    quality_filter_scores: null
  image_key: observation.images.image
  state_key: observation.state
  action_key: action
  state_dim: 8
  action_dim: 7
  action_horizon: 8
  train_crop_size: 115
  output_image_size: 256
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.05
  episode_cache_size: 2
  num_workers: 4
  prefetch_factor: 2
  normalization_epsilon: 1.0e-6

model:
  backbone_family: qwen3_vl
  text_layers: 36
  context_dim: 2560
  max_context_tokens: 512
  context_forward: causal_lm
  attn_implementation: auto
  gradient_checkpointing: false
  torch_compile:
    enabled: false
    backbone_enabled: false
    action_head_enabled: true
    backend: inductor
    mode: default
    dynamic: true
    fullgraph: false
  lora:
    rank: 16
    alpha: 32
    dropout: 0.05
    target_modules:
      full_attention: [q_proj, k_proj, v_proj, o_proj]
      linear_attention: []
      mlp: [gate_proj, up_proj, down_proj]
  dit:
    hidden_size: 1024
    num_layers: 12
    num_heads: 16
    mlp_ratio: 4
    dropout: 0.2
  flow:
    beta_alpha: 1.5
    beta_beta: 1.0
    noise_s: 0.999
    denoising_steps: 4
  state_dropout_prob: 0.8

train:
  seed: 42
  gpu_count: 4
  gpu_ids: [0, 1, 2, 3]
  micro_batch_size: 1
  gradient_accumulation_steps: 16
  max_steps: 20000
  head_learning_rate: 1.0e-4
  lora_learning_rate: 1.0e-5
  weight_decay: 0.01
  head_warmup_steps: 1000
  lora_freeze_steps: 2000
  lora_warmup_steps: 500
  max_grad_norm: 1.0
  log_every_steps: 10
  save_every_steps: 1000
  validation_enabled: false
  bf16: true
  deepspeed_stage: 2
  cpu_optimizer_offload: false
