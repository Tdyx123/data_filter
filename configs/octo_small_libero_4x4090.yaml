paths:
  model: /data/dwb/models/octo-small-pytorch
  lerobot: /data/dwb/datasets/LIBERO_lerobot

data:
  prior_dataset: libero90
  target_dataset: libero10_5
  target_task_index: null
  target_all_tasks: false
  target_only: false
  prior_selection:
    scores: outputs/tdus/libero90/chunk/scores.csv
    top_percent: null
    prefiltered: false
    relcore_manifest: null
  sample_weights: [1.0, 1.0]
  image_obs_keys:
    primary: observation.images.image
    wrist: observation.images.image2
  state_obs_keys: [observation.state]
  action_key: action
  state_dim: 8
  action_dim: 7
  window_size: 1
  action_horizon: 8
  absolute_action_mask: [false, false, false, false, false, false, true]
  action_normalization_mask: [true, true, true, true, true, true, false]
  resize:
    primary: [256, 256]
    wrist: [128, 128]

model:
  pretrained_step: 270000
  required_observation_tokenizers: [primary, wrist]
  use_proprio: true
  proprio:
    obs_keys: [proprio]
    n_bins: 256
    bin_type: normal
    low: -2.0
    high: 2.0
  action_head: diffusion
  finetuning_mode: full

train:
  seed: 42
  gpu_count: 4
  gpu_ids: [0, 1, 2, 3]
  batch_size: 128
  micro_batch_size_per_gpu: 8
  gradient_accumulation_steps: 4
  max_steps: 10000
  num_workers_per_rank: 4
  prefetch_factor: 2
  episode_cache_size: 2
  precision: bf16
  learning_rate:
    name: cosine
    init_value: 0.0
    peak_value: 3.0e-4
    warmup_steps: 400
    end_value: 0.0
  weight_decay: 0.01
  max_grad_norm: 1.0
  frozen_keys: null
  log_every_steps: 100
  save_every_steps: 1000
  wandb:
    enabled: false
    project: octo_finetune
    group: libero10_5_4x4090
    entity: null
