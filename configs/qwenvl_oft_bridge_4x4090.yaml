paths:
  model: /data/dwb/models/Qwen3-VL-4B-Instruct
  dataset: /data/dwb/datasets/bridge_orig_1.0.0_lerobo
  output: outputs/qwenvl_4b_oft_bridge_4gpu

data:
  dataset_type: bridge
  image_key: observation.images.image_0
  state_key: observation.state
  action_key: action
  state_dim: 8
  action_dim: 7
  action_horizon: 16
  split_seed: 42
  validation_percent: 1
  fallback_instruction: "Perform the demonstrated manipulation task."
  train_crop_size: 230
  output_image_size: 256
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.05
  video_cache_episodes: 2
  num_workers: 4
  prefetch_factor: 2
  normalization_epsilon: 1.0e-6

model:
  backbone_family: qwen3_vl
  text_layers: 36
  context_dim: 2560
  attn_implementation: sdpa
  gradient_checkpointing: false
  state_bins: 256
  action_token: "🔍"
  action_head_hidden_dim: 5120
  torch_compile:
    enabled: false
    backbone_enabled: false
    action_head_enabled: true
    backend: inductor
    mode: default
    dynamic: true
    fullgraph: false
  lora:
    rank: 16
    alpha: 32
    dropout: 0.05
    target_modules:
      full_attention: [q_proj, k_proj, v_proj, o_proj]
      linear_attention: []
      mlp: [gate_proj, up_proj, down_proj]

train:
  seed: 42
  gpu_count: 4
  gpu_ids: [0, 1, 2, 3]
  micro_batch_size: 1
  gradient_accumulation_steps: 16
  max_steps: 20000
  head_learning_rate: 1.0e-4
  lora_learning_rate: 1.0e-5
  weight_decay: 0.01
  head_warmup_steps: 1000
  lora_freeze_steps: 2000
  lora_warmup_steps: 500
  max_grad_norm: 1.0
  log_every_steps: 10
  eval_every_steps: 1000
  save_every_steps: 1000
  validation_batches: 50
  validation_enabled: true
  bf16: true
  deepspeed_stage: 2
  cpu_optimizer_offload: false
