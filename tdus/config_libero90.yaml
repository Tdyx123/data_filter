dataset:
  type: lerobot
  name: libero90
  path: /data/dwb/datasets/LIBERO_lerobot/libero90
  use_images: true
  feature_keys:
    action: action
    timestamp: timestamp
    frame_index: frame_index
    episode_index: episode_index
    vector_observations:
      - observation.state
    image_observations:
      - observation.images.image

segmentation:
  modes: [trajectory, chunk]
  chunk_length: 15
  stride: 15
  max_episodes: null

encoder:
  vision_backend: auto
  clip_model: /data/dwb/models/clip-vit-base-patch32
  clip_local_files_only: true
  max_frames_per_segment: 8
  image_batch_size: 64
  fallback_image_size: 32
  fallback_frame_dim: 128
  fallback_fit_frames: 10000
  embedding_dim: 128
  pca_fit_max_samples: null
  device: auto
  dtype: float32

quality:
  action_smooth_weight: 0.4
  state_transition_weight: 0.3
  motion_efficiency_weight: 0.3
  quantile_low: 0.01
  quantile_high: 0.99
  epsilon: 1.0e-8

coverage:
  sigma: median
  sigma_sample_size: 4096
  sigma_pair_samples: 100000
  reference_max_samples: null
  batch_size: 2048
  device: auto

diversity:
  reference_size: 4096
  batch_size: 2048
  device: auto

novelty:
  k: 20
  backend: auto
  batch_size: 2048
  quantile_low: 0.01
  quantile_high: 0.99

weights:
  quality: 0.25
  coverage: 0.35
  diversity: 0.25
  novelty: 0.15

runtime:
  seed: 42
  num_workers: 4
  resume: true

output:
  root: outputs/tdus

analysis:
  primary_mode: chunk
  tsne_max_samples: 5000
  tsne_perplexity: 30
  histogram_bins: 40
  dpi: 160
