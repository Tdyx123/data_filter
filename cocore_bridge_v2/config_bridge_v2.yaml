seed: 42

dataset:
  type: lerobot
  name: bridge_orig_1.0.0
  path: /data/dwb/datasets/bridge_orig_1.0.0_lerobot
  use_images: true
  empty_task_policy: exclude
  feature_keys:
    action: action
    timestamp: timestamp
    frame_index: frame_index
    episode_index: episode_index
    vector_observations: [observation.state]
    image_observations: [observation.images.image_0]

visual:
  encoder: clip
  model: /data/dwb/models/clip-vit-base-patch32
  local_files_only: true
  batch_size: 64
  device: cuda

encoding:
  visual_dim: 128
  pca_fit_max_samples: null
  quantile_low: 0.01
  quantile_high: 0.99
  epsilon: 1.0e-8

quality:
  knn: 10
  gripper_progress_weight: 0.5
  visual_progress_weight: 0.25
  noop_threshold: 1.0e-4
  gripper_action_index: -1
  min_reliability: 0.05

prototypes:
  method: motion_primitives
  profile: bridge_v2
  batch_size: 4096
  max_iter: 100
  tol: 1.0e-4
  num_threads: 4
  use_stop_bucket: true

graph:
  knn: 32
  similarity_threshold: 0.80
  cooccurrence_max_gap: 4

selection:
  ratio: 0.10
  budget: null

runtime:
  num_workers: 4
  max_episodes: null
  resume: true

output:
  directory: outputs/cocore_bridge_v2/bridge_orig_1.0.0
