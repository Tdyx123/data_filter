[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen3-vl-groot-bridge"
version = "0.1.0"
description = "Standalone Qwen3-VL + GR00T-style flow-matching VLA fine-tuning for BridgeData V2"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.9.0",
  "torchvision==0.24.0",
  "transformers==5.2.0",
  "peft==0.18.0",
  "deepspeed==0.17.6",
  "pyarrow==18.1.0",
  "av==14.0.1",
  "safetensors==0.5.3",
  "tensorboard==2.18.0",
  "PyYAML==6.0.2",
  "Pillow==11.1.0",
  "numpy==2.1.3",
  "tqdm==4.67.1",
]

[project.optional-dependencies]
flash = ["flash-attn==2.7.4.post1"]
test = ["pytest==8.3.5", "pytest-timeout==2.3.1"]

[project.scripts]
qwen3-vl-groot = "qwen3_vl_groot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "real_data: checks mounted real datasets",
  "gpu: requires CUDA",
  "slow: takes more than a few seconds",
  "timeout: bounds a subprocess regression when pytest-timeout is installed",
]

[tool.ruff]
line-length = 100
target-version = "py312"
