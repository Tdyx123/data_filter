seed: 42

dataset:
  type: lerobot
  name: libero90-debug
  path: /data/dwb/datasets/LIBERO_lerobot/libero90
  use_images: true
  feature_keys:
    vector_observations: [observation.state]
    image_observations: [observation.images.image]

visual:
  encoder: dummy

encoding:
  visual_dim: 128
  pca_fit_max_samples: null
  quantile_low: 0.01
  quantile_high: 0.99
  epsilon: 1.0e-8

prototypes:
  method: motion_primitives
  profile: libero
  num_threads: 1
  use_stop_bucket: true

objective:
  relation: cooccurrence
  relation_weight: 1.0

selection:
  method: lazy_heap
  ratio: 1.0
  budget: null
  max_refreshes: 100

runtime:
  max_episodes: 20
  num_workers: 0

output:
  directory: outputs/cocore/debug
